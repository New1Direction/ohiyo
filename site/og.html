<!doctype html>
<!-- The social card. og.png is a 1200x630 screenshot of this page; it is not linked from the site. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Ohiyo social card</title>
<link rel="stylesheet" href="site.css" />
<style>
  body { width: 1200px; height: 630px; overflow: hidden; }
  .card-og { position: relative; display: grid; align-content: space-between; width: 1200px; height: 630px; padding: 64px 72px; }
  .card-og .brand { font-size: 40px; }
  .card-og .brand .mark { width: 56px; }
  .card-og h1 { font-size: 92px; max-width: 760px; }
  .card-og p { font: 600 28px/1.3 var(--font-body); color: var(--muted); }
  .card-og .kikka-hello { right: 64px; top: 150px; }
  .card-og .kikka { width: 300px; animation: none; }
  .card-og .bubble { font-size: 40px; padding: 18px 28px; border-radius: 28px; border-width: 3px; box-shadow: 0 7px 0 var(--ink); animation: none; }
  .card-og .bubble::after { width: 22px; height: 22px; right: -14px; border-width: 3px; }
</style>
</head>
<body>
<div class="card-og">
  <span class="brand"><span class="mark"></span><span>o<b>Hi</b>Yo</span></span>
  <h1>Group chat that's actually <span class="hl">yours.</span></h1>
  <p>Free and open source. Runs in your browser.</p>
  <div class="kikka-hello">
    <span class="bubble">oh, hi.</span>
    <img class="kikka" src="assets/kikka-color.svg" alt="" />
  </div>
</div>
</body>
</html>
