<!doctype html>
<!-- The social card. og.jpg is a 1200x630 screenshot of this page; it is not linked from the site. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Ohiyo social card</title>
<link rel="stylesheet" href="site.css?v=5bc24c3878" />
<style>
  body { width: 1200px; height: 630px; overflow: hidden; }
  /* The same painting as the first screen of the site: the words on the sky, the stone mark and Kikka on the right. */
  .card-og { position: relative; display: grid; align-content: space-between; justify-items: start; width: 1200px; height: 630px; padding: 56px 72px 60px; background: #9ec9ef url("assets/scenery/meadow-1738.webp") right bottom / cover no-repeat; }
  .card-og .brand { font-size: 40px; }
  .card-og .brand .mark { width: 56px; }
  .card-og h1 { font-size: 70px; }
  .card-og h1 span { display: block; white-space: nowrap; }
  .card-og h1 .hl { display: inline-block; }
  .card-og .hl::after { left: -7%; right: -9%; bottom: -0.1em; height: 0.3em; rotate: -1.6deg; }
  .card-og p { padding: 10px 20px; border-radius: 999px; background: rgb(255 252 242 / 90%); font: 600 26px/1.3 var(--font-body); color: var(--ink); }
</style>
</head>
<body>
<div class="card-og">
  <span class="brand"><span class="mark"></span><span>o<b>Hi</b>Yo</span></span>
  <h1><span>Group chat</span> <span>that's actually</span> <span class="hl">yours.</span></h1>
  <p>Free and open source. Runs in your browser.</p>
</div>
</body>
</html>
