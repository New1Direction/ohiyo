[package]
name = "client"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Locked-RAM E2E key vault (vendored dazai/goodnight) + OS-keychain master key.
kikka-vault = { path = "crates/vault" }
rand = "0.9"

# Single-instance focuses the existing window on a second launch (and carries
# ohiyo:// deep links into the running app on Windows/Linux). Desktop only.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# "Open Ohiyo when I log in". Desktop only. Held at 2.5: 2.6 and later need Tauri 2.12,
# and moving Tauri is its own change (the npm @tauri-apps packages must move with it).
tauri-plugin-autostart = "~2.5"
# The app offers its own updates. Desktop only. Held at 2.12 for the same reason; the
# npm @tauri-apps/plugin-updater is held at the same minor, as the Tauri CLI requires.
tauri-plugin-updater = "~2.13"

# OS keychain for the vault master key — native backend per platform.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

