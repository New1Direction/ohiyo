name: CI

on:
  push:
    branches: [main]
  pull_request:

# Quality gate so regressions can't merge. Every step is a hard gate — a failing
# format check, lint, build, or test blocks the merge.
jobs:
  client:
    name: Client (lint · types · unit · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 22: the unit tests run via the built-in runner with native TS
          # type-stripping (--experimental-strip-types), available from 22.6+.
          node-version: 22
      # Bun installs packages and runs the scripts; Node still runs tsc, ESLint, Vite and
      # the unit tests. Keep this version in step with client/Dockerfile.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: ESLint (hooks correctness + a11y)
        run: bun run lint
      - name: Type-check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
      - name: Production build
        run: bun run build

  server:
    name: Server (build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Guidance sandbox checks require deny-by-default networking permissions.
          node-version: 26
      - name: Install Pi worker for offline travel and project-spec integration
        working-directory: worker
        run: npm ci
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  desktop:
    name: Desktop (check · test)
    # Same runner image and system libraries as release.yml, so a build that passes here is
    # one the release workflow can also build. Without this job nothing compiles the Tauri
    # crate until a version tag is pushed, so a bad dependency bump would only show up then.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: client/src-tauri
      - name: Stand-in for the frontend build
        # tauri::generate_context! embeds frontendDist (../dist) at compile time and fails if
        # it is missing. The Client job already builds the real bundle; this only has to exist.
        run: |
          mkdir -p ../dist
          printf '<!doctype html><title>ci</title>\n' > ../dist/index.html
      - name: Check
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: GLib security backport regression (optimized upstream tests)
        # RUSTSEC-2024-0429 can disappear in debug builds. cargo-audit does not
        # inspect local-path crates; exercise the actual backported source.
        run: cargo test --manifest-path vendor/glib-0.18.5/Cargo.toml --release --lib variant_iter::tests

  selfhost:
    name: Self-hosting (config · recovery)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Validate Compose without revealing expanded configuration
        env:
          OHIYO_DOMAIN: chat.example.invalid
          OHIYO_VERSION: ci
          JWT_SECRET: ci-fixture-not-a-production-secret
          OHIYO_TOTP_KEY: ci-fixture-not-a-production-key
        run: docker compose -f infra/selfhost/compose.yaml config --quiet
      - name: Validate TLS proxy configuration offline
        run: |
          docker run --rm --network none -e OHIYO_DOMAIN=chat.example.invalid \
            -v "$PWD/infra/selfhost/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Full-volume restore and shutdown safety regressions
        run: |
          bash -n infra/selfhost/backup.sh
          python3 -B -m unittest discover -s infra/selfhost -p 'test_*.py' -v

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: bun audit (client dependencies)
        working-directory: client
        # Reads client/bun.lock. Unlike the old `npm audit --omit=dev`, this also covers
        # dev dependencies (Vite, tsc, ESLint), which run on every build machine.
        run: bun audit --audit-level=low
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit
      - name: cargo audit (server)
        working-directory: server
        # RUSTSEC-2023-0071 (rsa, timing side channel) has no fixed release yet.
        run: cargo audit --deny unsound --ignore RUSTSEC-2023-0071

  audit-desktop:
    name: Dependency advisories (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit
      - name: cargo audit (desktop)
        run: cargo audit --deny unsound --file client/src-tauri/Cargo.lock
      - name: cargo audit (standalone vault)
        run: cargo audit --deny unsound --file client/src-tauri/crates/vault/Cargo.lock
      - name: cargo audit (standalone secure memory)
        run: cargo audit --deny unsound --file client/src-tauri/crates/goodnight/Cargo.lock

  audit-worker:
    name: Dependency advisories (worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: npm audit (worker lockfile, including dev dependencies)
        working-directory: worker
        run: npm audit --audit-level=low

  audit-browser:
    name: Dependency advisories (browser engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Python auditor
        run: python -m pip install pip-audit==2.10.1
      - name: pip-audit (browser engine, including transitive dependencies)
        run: python -m pip_audit --strict --requirement worker/browser-engine/requirements.txt
