name: Watch modes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watch-modes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Dream browser and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium
      - name: Exercise real component and capture screenshots
        run: |
          export KIKKA_CHROMIUM="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          export KIKKA_SHOTS="$RUNNER_TEMP/watch-mode-shots"
          bun run test:watch-dream
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: watch-mode-screenshots
          path: ${{ runner.temp }}/watch-mode-shots
          if-no-files-found: warn
