name: E2E

# Hosted browser coverage is now a real PR/push signal. Each job drives Chromium
# against a full local stack and runs twice: Vite dev (fast feedback) and the
# production preview build (catches CSP/bundle/build-only regressions).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-22.04
    concurrency:
      group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ matrix.client_mode }}
      cancel-in-progress: true
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        client_mode: [dev, production-preview]
    name: E2E (${{ matrix.client_mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server

      - name: Install client deps + Chromium
        working-directory: client
        run: |
          bun install --frozen-lockfile
          bunx playwright-core install --with-deps chromium

      - name: UI browser regressions
        if: matrix.client_mode == 'dev'
        working-directory: client
        run: |
          export KIKKA_CHROMIUM="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          export KIKKA_SHOTS=/tmp/ohiyo-ui-shots
          mkdir -p "$KIKKA_SHOTS"
          bun run test:watch-dream
          bun run test:server-sidebar
          bun run test:profile-editor

      - name: Upload UI screenshots
        if: always() && matrix.client_mode == 'dev'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-regression-screenshots
          path: /tmp/ohiyo-ui-shots
          if-no-files-found: ignore

      - name: Build server
        working-directory: server
        run: cargo build --locked

      - name: Run hosted E2E stack
        env:
          CLIENT_MODE: ${{ matrix.client_mode }}
          BIND_ADDR: 127.0.0.1:3000
          DATABASE_URL: sqlite:/tmp/ohiyo-${{ matrix.client_mode }}.db
          JWT_SECRET: ci-e2e-secret-not-for-production-0123456789
          OHIYO_REGISTER_LIMIT_PER_HOUR: "0" # every suite registers from one address
          VITE_SERVER_URL: http://localhost:3000
          KIKKA_ORIGIN: http://localhost:1420
          KIKKA_SHOTS: /tmp/kikka-shots-${{ matrix.client_mode }}
        run: |
          set -euo pipefail
          mkdir -p "$KIKKA_SHOTS"
          rm -f "/tmp/ohiyo-${CLIENT_MODE}.db" "/tmp/ohiyo-${CLIENT_MODE}.db-shm" "/tmp/ohiyo-${CLIENT_MODE}.db-wal"

          server/target/debug/server >"/tmp/ohiyo-server-${CLIENT_MODE}.log" 2>&1 &
          server_pid=$!

          cleanup() {
            if [ -n "${client_pid:-}" ]; then
              pkill -TERM -P "$client_pid" 2>/dev/null || true
              kill "$client_pid" 2>/dev/null || true
            fi
            pkill -TERM -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/healthz >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Server exited before /healthz" >&2
              cat "/tmp/ohiyo-server-${CLIENT_MODE}.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/healthz >/dev/null

          if [ "$CLIENT_MODE" = "production-preview" ]; then
            (cd client && bun run build)
            (cd client && bun run preview -- --host 127.0.0.1 --port 1420) >"/tmp/ohiyo-client-${CLIENT_MODE}.log" 2>&1 &
          else
            (cd client && bun run dev -- --host 127.0.0.1 --port 1420) >"/tmp/ohiyo-client-${CLIENT_MODE}.log" 2>&1 &
          fi
          client_pid=$!

          for i in $(seq 1 45); do
            if curl -sf "$KIKKA_ORIGIN" >/dev/null; then break; fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              echo "Client exited before serving $KIKKA_ORIGIN" >&2
              cat "/tmp/ohiyo-client-${CLIENT_MODE}.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          curl -sf "$KIKKA_ORIGIN" >/dev/null

          export KIKKA_CHROMIUM="$(node -e "console.log(require('./client/node_modules/playwright-core').chromium.executablePath())")"
          node e2e/run.mjs

      # The message bar's, the space menu's and the user bar's screenshots (desktop dark and
      # light, phone), kept on every run so they can be looked at, not only when something fails.
      - name: Upload message bar, space menu and user bar screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: message-bar-${{ matrix.client_mode }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/kikka-shots-${{ matrix.client_mode }}/44-message-bar-*.png
            /tmp/kikka-shots-${{ matrix.client_mode }}/47-space-menu-*.png
            /tmp/kikka-shots-${{ matrix.client_mode }}/48-message-formatting-*.png
            /tmp/kikka-shots-${{ matrix.client_mode }}/49-user-bar-*.png
            /tmp/kikka-shots-${{ matrix.client_mode }}/50-notif-*.png
            /tmp/kikka-shots-${{ matrix.client_mode }}/51-threads-*.png
            /tmp/kikka-shots-${{ matrix.client_mode }}/52-webhooks-*.png
            /tmp/kikka-shots-${{ matrix.client_mode }}/54-search-*.png
            /tmp/kikka-shots-${{ matrix.client_mode }}/58-two-factor-*.png

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ matrix.client_mode }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/kikka-shots-${{ matrix.client_mode }}
            /tmp/ohiyo-server-${{ matrix.client_mode }}.log
            /tmp/ohiyo-client-${{ matrix.client_mode }}.log
