name: Release

# Build the desktop installers on every version tag (and on manual dispatch), and
# attach them to a DRAFT GitHub Release. Release downloads must support signed
# updates; macOS additionally requires Developer ID signing and notarization.
# Missing credentials stop the build, never fall back to an untrusted download.
# Plain local builds remain available for development. See DEPLOY.md §4–5.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
          # Windows is temporarily disabled: crates/goodnight (the key vault) uses
          # POSIX-only libc (mmap/mlock/getuid/RLIMIT_MEMLOCK) that doesn't compile on
          # Windows. Re-enable once it's cfg-gated with a Windows VirtualLock fallback.
          # - platform: windows-latest
          #   target: ""
    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Require trusted release signing
        shell: bash
        run: |
          if [[ "$HAS_UPDATE_KEY" != 'true' ]]; then
            echo "::error::Release downloads require TAURI_SIGNING_PRIVATE_KEY so installed apps can receive signed updates."
            exit 1
          fi
          if [[ "$RUNNER_OS" == 'macOS' && "$HAS_APPLE_SIGNING" != 'true' ]]; then
            echo "::error::Mac release downloads require Developer ID signing and Apple notarization. Configure the Apple secrets in DEPLOY.md; no ad-hoc fallback will be published."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Keep this version in step with ci.yml and client/Dockerfile.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: client/src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      # Update bundles are made here and nowhere else, so a plain local
      # `bun run tauri build` needs no signing key. The same condition sets
      # VITE_DESKTOP_UPDATES on the build steps: only these builds look for updates,
      # so a copy someone builds by hand is never replaced by ours. See DEPLOY.md §5.
      - name: Turn on signed update bundles
        if: env.HAS_UPDATE_KEY == 'true'
        working-directory: client
        run: |
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.bundle.createUpdaterArtifacts=true; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');"

      - name: Enable macOS Developer ID signing
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_SIGNING == 'true'
        working-directory: client
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.bundle.macOS.signingIdentity=process.env.APPLE_SIGNING_IDENTITY; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');"

      - name: Build desktop installers (macOS signed + notarized)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DESKTOP_UPDATES: ${{ env.HAS_UPDATE_KEY == 'true' && '1' || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        with:
          projectPath: client
          tauriScript: bun run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Ohiyo v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Verify macOS Gatekeeper trust before release
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_SIGNING == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(client/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app client/src-tauri/target/release/bundle/macos/*.app)
          dmgs=(client/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg client/src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No .app bundle found to verify"
            find client/src-tauri/target -maxdepth 6 -type f | sort | tail -200
            exit 1
          fi
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No .dmg bundle found to verify"
            find client/src-tauri/target -maxdepth 6 -type f | sort | tail -200
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "Verifying app signature: $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vvv -t execute "$app"
          done
          for dmg in "${dmgs[@]}"; do
            echo "Verifying notarized DMG: $dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vvv -t install "$dmg"
          done

      - name: Build desktop installers (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DESKTOP_UPDATES: ${{ env.HAS_UPDATE_KEY == 'true' && '1' || '' }}
        with:
          projectPath: client
          tauriScript: bun run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Ohiyo v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
